[workspace]
resolver = "3"
members = ["crates/core", "crates/index", "crates/store", "crates/cli", "crates/server", "crates/py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Navatej Ratnan <navatejratnanpersonal@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/NavatejR/lodestar"
homepage = "https://github.com/NavatejR/lodestar"
readme = "README.md"
keywords = ["ann", "vector-search", "hnsw", "similarity-search", "embeddings"]
categories = ["algorithms", "database-implementations", "science"]

[workspace.dependencies]
lodestar-ann-core = { path = "crates/core", version = "0.1.0" }
lodestar-ann-index = { path = "crates/index", version = "0.1.0" }
lodestar-ann-store = { path = "crates/store", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
