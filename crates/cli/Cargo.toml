[package]
name = "lodestar-ann-cli"
description = "Command-line interface for building, searching and benchmarking indexes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
lodestar-ann-core.workspace = true
lodestar-ann-index.workspace = true
lodestar-ann-server = { version = "0.1.0", path = "../server" }
lodestar-ann-store.workspace = true
serde_json.workspace = true
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[[bin]]
name = "lodestar"
path = "src/main.rs"
