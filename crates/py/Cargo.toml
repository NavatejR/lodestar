[package]
name = "lodestar-ann-py"
description = "Python bindings for Lodestar (PyO3 + NumPy)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
lodestar-ann-core.workspace = true
lodestar-ann-index.workspace = true
lodestar-ann-store.workspace = true
# `extension-module` means Python symbols are resolved when the module is
# loaded, not at link time, which is what lets `maturin` build a wheel against
# the abi3 ABI without a libpython. The flip side is that no *executable* can
# link this crate on macOS, so the workspace's `cargo test` excludes it (see the
# Makefile) and the bindings are verified through `make test-py` instead.
numpy = "0.29.0"
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py39"] }

[lib]
# The library name must match the `#[pymodule]` function: the cdylib is
# imported as `lodestar_native` and its init symbol is
# `PyInit_lodestar_native`.
name = "lodestar_native"
crate-type = ["cdylib", "rlib"]
