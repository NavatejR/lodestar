<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lodestar console</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12141a; --panel: #191c23; --line: #262b34; --fg: #e8eaf0;
    --dim: #98a2b3; --accent: #7cc4ff; --ok: #7ee787; --warn: #ffd479; --bad: #ff7b72;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: baseline;
           padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); position: sticky; top: 0;
           background: rgba(18,20,26,.94); backdrop-filter: blur(6px); z-index: 2; }
  h1 { font-size: 1.1rem; margin: 0; letter-spacing: .01em; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
       margin: 0 0 .75rem; }
  main { display: grid; gap: 1rem; padding: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
  section.wide { grid-column: 1 / -1; }
  label { display: block; color: var(--dim); font-size: .78rem; margin-bottom: .2rem; }
  input, select, textarea, button { font: inherit; color: var(--fg); background: #10131a;
       border: 1px solid var(--line); border-radius: 7px; padding: .4rem .55rem; }
  textarea { width: 100%; min-height: 4.5rem; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
  input, select { width: 100%; }
  button { cursor: pointer; background: #1e2530; }
  button.primary { background: #1d3b57; border-color: #2b5b86; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1 1 8rem; }
  .row > button { flex: 0 0 auto; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th, td { text-align: left; padding: .35rem .4rem; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  code, pre { font-family: ui-monospace, Menlo, monospace; font-size: .78rem; }
  pre { background: #10131a; border: 1px solid var(--line); border-radius: 8px; padding: .7rem;
        overflow: auto; max-height: 16rem; margin: 0; }
  .badge { font-size: .74rem; color: var(--dim); }
  .badge b { color: var(--fg); font-weight: 600; }
  .pill { display: inline-block; padding: .05rem .45rem; border-radius: 999px;
          border: 1px solid var(--line); font-size: .72rem; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .muted { color: var(--dim); }
  a { color: var(--accent); }
  #log { max-height: 12rem; }
  .hint { color: var(--dim); font-size: .78rem; margin: .35rem 0 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
</style>
</head>
<body>
<header>
  <h1>Lodestar console</h1>
  <span class="badge" id="env">&hellip;</span>
  <span style="flex:1"></span>
  <span class="badge"><a href="/docs">docs</a> &middot; <a href="/openapi.json">openapi</a> &middot;
  <a href="/metrics">metrics</a> &middot; <a href="/healthz">health</a></span>
</header>

<main>
  <section>
    <h2>Collections</h2>
    <div class="row">
      <div>
        <label for="collection">Collection</label>
        <select id="collection"></select>
      </div>
      <button id="refresh">Refresh</button>
    </div>
    <p class="hint" id="collection-hint">No collection selected.</p>
    <div class="row" style="margin-top:.6rem">
      <button id="stats">Stats</button>
      <button id="flush">Flush</button>
      <button id="compact">Compact</button>
      <button id="verify">Verify</button>
    </div>
  </section>

  <section>
    <h2>Search</h2>
    <label for="vectors">Query vector(s), one JSON array per line &mdash; empty means random</label>
    <textarea id="vectors" placeholder="[0.1, 0.2, ...]"></textarea>
    <div class="grid2">
      <div><label for="k">k</label><input id="k" type="number" value="10" min="1" max="1000"></div>
      <div><label for="ef">ef (0 = default)</label><input id="ef" type="number" value="0" min="0"></div>
    </div>
    <label for="filter" style="margin-top:.5rem">Filter (metadata expression)</label>
    <input id="filter" placeholder='group == news AND score >= 0.8'>
    <div class="row" style="margin-top:.7rem">
      <button class="primary" id="search">Search</button>
      <button id="random">Random query</button>
      <label style="flex:0 0 auto; display:flex; align-items:center; gap:.35rem; color:var(--dim)">
        <input type="checkbox" id="metadata" style="width:auto"> metadata
      </label>
    </div>
    <div id="results" style="margin-top:.75rem"></div>
  </section>

  <section>
    <h2>Selected collection</h2>
    <pre id="stats-out">Run Stats, Flush, Compact or Verify.</pre>
  </section>

  <section>
    <h2>Service metrics</h2>
    <pre id="metrics-out">Scrape /metrics to see counters.</pre>
    <div class="row" style="margin-top:.6rem"><button id="scrape">Scrape</button></div>
  </section>

  <section class="wide">
    <h2>Request log</h2>
    <pre id="log">Every action is logged here with its status and wall time.</pre>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { collections: [], selected: null };

function log(message, tone = "") {
  const stamp = new Date().toISOString().slice(11, 23);
  const line = `<span class="muted">${stamp}</span> <span class="${tone}">${message}</span>`;
  const box = $("log");
  box.innerHTML = (box.innerHTML + "\n" + line).trim();
  box.scrollTop = box.scrollHeight;
}

async function api(path, options = {}) {
  const started = performance.now();
  const response = await fetch(path, options);
  const elapsed = (performance.now() - started).toFixed(1);
  const text = await response.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  const tone = response.ok ? "ok" : "bad";
  log(`${options.method || "GET"} ${path} &rarr; ${response.status} in ${elapsed}ms`, tone);
  if (!response.ok) {
    const detail = body && body.error ? `${body.error.code}: ${body.error.message}` : text;
    throw new Error(detail || `HTTP ${response.status}`);
  }
  return body;
}

async function loadEnvironment() {
  try {
    const health = await api("/healthz");
    $("env").innerHTML = `version <b>${health.version}</b> &middot; kernel <b>${health.kernel}</b> ` +
      `&middot; uptime <b>${Math.round(health.uptime_seconds)}s</b> ` +
      `&middot; <b>${health.collections}</b> collections` +
      (health.read_only ? ' &middot; <span class="warn">read-only</span>' : "");
  } catch (error) { $("env").textContent = String(error.message); }
}

async function loadCollections() {
  const collections = await api("/v1/index");
  state.collections = collections;
  const select = $("collection");
  const previous = state.selected;
  select.innerHTML = "";
  for (const collection of collections) {
    const option = document.createElement("option");
    option.value = collection.name;
    option.textContent = `${collection.name} — ${collection.live.toLocaleString()} vectors, ` +
      `${collection.dim}d ${collection.metric}`;
    select.appendChild(option);
  }
  if (!collections.length) {
    $("collection-hint").textContent = "No collections yet. Seed the demo or create one with the API.";
    state.selected = null;
    return;
  }
  state.selected = collections.find((c) => c.name === previous) ? previous : collections[0].name;
  select.value = state.selected;
  describe();
}

function selected() {
  return state.collections.find((c) => c.name === state.selected) || null;
}

function describe() {
  const collection = selected();
  if (!collection) return;
  $("collection-hint").innerHTML =
    `<b>${collection.name}</b> &middot; ${collection.live.toLocaleString()} live vectors ` +
    `(${collection.pending.toLocaleString()} pending) &middot; ${collection.segments} segment(s) ` +
    `&middot; ${(collection.mapped_bytes / 1e6).toFixed(1)} MB mapped ` +
    `&middot; ${collection.metadata_entries.toLocaleString()} metadata entries`;
}

function randomVector(dim) {
  return Array.from({ length: dim }, () => (Math.random() * 2 - 1));
}

function parseQueries(dim) {
  const lines = $("vectors").value.split("\n").map((line) => line.trim()).filter(Boolean);
  if (!lines.length) return [randomVector(dim)];
  return lines.map((line) => {
    const value = JSON.parse(line);
    if (!Array.isArray(value)) throw new Error("each line must be a JSON array of numbers");
    return value;
  });
}

async function search() {
  const collection = selected();
  if (!collection) return;
  const queries = parseQueries(collection.dim);
  const payload = { index: collection.name, queries, k: Number($("k").value) || 10 };
  const ef = Number($("ef").value) || 0;
  if (ef > 0) payload.ef = ef;
  if ($("filter").value.trim()) payload.filter = $("filter").value.trim();
  payload.include_metadata = $("metadata").checked;
  const body = await api("/v1/search", {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload),
  });
  renderResults(body);
}

function renderResults(body) {
  const parts = [`<div class="hint">${body.results.length} query/queries &middot; dim ${body.dim} ` +
    `&middot; ${body.metric} &middot; ef ${body.ef} &middot; ${body.took_ms.toFixed(2)}ms total</div>`];
  body.results.forEach((result, index) => {
    parts.push(`<table><thead><tr><th>#</th><th>id</th><th class="num">distance</th>` +
      `<th>metadata</th></tr></thead><tbody>`);
    result.hits.forEach((hit, rank) => {
      const metadata = hit.metadata ? `<code>${JSON.stringify(hit.metadata)}</code>` : "";
      parts.push(`<tr><td>${rank + 1}</td><td>${hit.id}</td>` +
        `<td class="num">${hit.distance.toFixed(4)}</td><td>${metadata}</td></tr>`);
    });
    if (!result.hits.length) parts.push(`<tr><td colspan="4" class="muted">no matches</td></tr>`);
    parts.push(`</tbody></table><div class="hint">query ${index + 1}: ${result.took_ms.toFixed(2)}ms</div>`);
  });
  $("results").innerHTML = parts.join("");
}

async function maintenance(action) {
  if (!state.selected) return;
  const suffix = action === "stats" ? "/stats" : `/${action}`;
  const method = action === "stats" ? "GET" : "POST";
  const body = await api(`/v1/index/${encodeURIComponent(state.selected)}${suffix}`,
    method === "GET" ? {} : { method });
  $("stats-out").textContent = JSON.stringify(body, null, 2);
  await loadCollections();
}

async function scrape() {
  const text = await api("/metrics");
  const wanted = text.split("\n").filter((line) =>
    !line.startsWith("#") &&
    /^lodestar_(requests|errors|engine_failures|search_queries|search_hits|vectors_upserted|ids_deleted|collections|uptime|read_only|collection_)/.test(line));
  $("metrics-out").textContent = wanted.join("\n");
}

$("refresh").addEventListener("click", () => loadCollections().catch(report));
$("collection").addEventListener("change", (event) => { state.selected = event.target.value; describe(); });
$("search").addEventListener("click", () => search().catch(report));
$("random").addEventListener("click", () => {
  const collection = selected();
  if (collection) $("vectors").value = JSON.stringify(randomVector(collection.dim).map((x) => Number(x.toFixed(4))));
});
for (const action of ["stats", "flush", "compact", "verify"]) {
  $(action).addEventListener("click", () => maintenance(action).catch(report));
}
$("scrape").addEventListener("click", () => scrape().catch(report));

function report(error) {
  $("results").innerHTML = `<div class="bad">${error.message}</div>`;
  log(error.message, "bad");
}

loadEnvironment().then(loadCollections).catch(report);
</script>
</body>
</html>
