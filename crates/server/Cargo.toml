[package]
name = "lodestar-ann-server"
description = "HTTP API and demo UI for Lodestar indexes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# The binary is called `lodestar-server` so that the Docker image and the docs
# have one short name to type, independent of the crate's registry name.
[[bin]]
name = "lodestar-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4", features = ["derive", "env"] }
lodestar-ann-core.workspace = true
lodestar-ann-index.workspace = true
lodestar-ann-store.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.2", features = ["util"] }
